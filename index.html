<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#132a21" />
    <meta name="description" content="Mobile hub for Yamato Vikings football activities." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/yamato-vikings-192.png" />
    <title>Yamato Vikings Hub</title>
  </head>
  <body>
    <div id="root">
      <div class="startup-loader" role="status" aria-busy="true">
        <div class="football-loader" aria-hidden="true">
          <img class="football-loader__portrait" src="%BASE_URL%brand/loading-portrait.webp" alt="" width="144" height="180" decoding="async" fetchpriority="low" />
          <img class="football-loader__ball" src="%BASE_URL%brand/loading-football.webp" alt="" width="44" height="44" decoding="async" fetchpriority="low" />
        </div>
        <p>Loading Yamato Vikings</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
